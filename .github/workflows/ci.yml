name: CI

on:
  push:
    branches: [main]
  pull_request:

# 品質閘門（docs/quality-gate.md）：下面每個工作都要通過，最後的「品質閘門」才會綠，PR 才能合併。
jobs:
  # 第 1 關：靜態檢查（ESLint、TypeScript 型別、素材大小預算）
  static:
    name: 靜態檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:assets

  # 第 2 關：單元測試（Vitest，含模擬核心的情境測試）
  unit:
    name: 單元測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # 第 3 關：打包並跑遊戲流程測試（Playwright，案例在 e2e/）
  e2e:
    name: 遊戲流程測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-assets.mjs --dist
      - run: npm run build:sim
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: ./gradlew test bootJar --no-daemon

  # Android App（Capacitor）：每次都打包一個測試版 APK，可以從這次執行的 Artifacts 下載安裝。
  # 設定了簽章金鑰（secrets）時，main 分支另外打包上架用的 AAB。
  android:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: cycle-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: 上架版 AAB（有簽章金鑰才做）
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "沒有設定簽章金鑰，略過"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: cycle-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

  # 分支保護只要求這一個檢查：上面全部通過才會綠。
  gate:
    name: 品質閘門
    if: always()
    needs: [static, unit, e2e, server, android]
    runs-on: ubuntu-latest
    steps:
      - name: 檢查所有關卡
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -E '"result": "(failure|cancelled|skipped)"'; then
            echo "有關卡沒過，不能合併"; exit 1
          fi
          echo "全部通過"
