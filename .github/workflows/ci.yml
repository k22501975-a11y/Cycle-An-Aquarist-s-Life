name: CI

on:
  push:
    branches: [main]
  pull_request:

# 預設只能讀 repo；需要寫的工作（beta-release）自己另外開
permissions:
  contents: read

# 品質閘門（docs/quality-gate.md）：下面每個工作都要通過，最後的「品質閘門」才會綠，PR 才能合併。
jobs:
  # 第 1 關：靜態檢查（ESLint、TypeScript 型別、素材大小預算、正式相依的已知漏洞）
  static:
    name: 靜態檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:assets
      # 遊戲本體會帶到玩家手上的套件，有 high 以上的已知漏洞就擋（開發工具另由 Dependabot 提醒）
      - run: npm audit --omit=dev --audit-level=high

  # 安全檢查：秘密掃描（整個 git 歷史）＋ PR 新增套件的漏洞與授權檢查
  security:
    name: 安全檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 秘密掃描（gitleaks）
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
      - name: 新增套件檢查
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # 第 2 關：單元測試（Vitest，含模擬核心的情境測試）
  unit:
    name: 單元測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # 第 3 關：打包並跑遊戲流程測試（Playwright，案例在 e2e/）
  e2e:
    name: 遊戲流程測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-assets.mjs --dist
      - run: npm run build:sim
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: ./gradlew test bootJar --no-daemon

  # Android App（Capacitor）：每次都打包一個測試版 APK，可以從這次執行的 Artifacts 下載安裝。
  # 設定了簽章金鑰（secrets）時，main 分支另外打包上架用的 AAB。
  android:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VERSION_CODE: ${{ github.run_number }}
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      # 版本號規則見 docs/release.md：main 是 0.1.0-beta.<執行編號>，其他分支是 0.1.0-dev.<執行編號>
      - id: version
        run: |
          base=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then name="$base-beta.$GITHUB_RUN_NUMBER"; else name="$base-dev.$GITHUB_RUN_NUMBER"; fi
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk "cycle-$VERSION_NAME.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: cycle-debug-apk
          path: cycle-*.apk
          retention-days: 14
      - name: 上架版 AAB（有簽章金鑰才做）
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "沒有設定簽章金鑰，略過"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: cycle-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

  # 分支保護只要求這一個檢查：上面全部通過才會綠。
  # 被條件略過（skipped）的工作視為通過；失敗或取消就擋下。
  gate:
    name: 品質閘門
    if: always()
    needs: [static, security, unit, e2e, server, android]
    runs-on: ubuntu-latest
    steps:
      - name: 有關卡失敗或被取消
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "有關卡沒過，不能合併"
          exit 1
      - run: echo "全部通過"

  # 測試版發布：main 上品質閘門（gate）通過才發，見 docs/quality-gate.md。
  # 每版一個 GitHub pre-release（v0.1.0-beta.N，留最近 10 版），
  # 另外 beta 這個固定標籤永遠指向最新一版，下載網址不會變。
  beta-release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [gate, android] # android 是為了拿版本號和 APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: beta-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION_NAME: ${{ needs.android.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: cycle-debug-apk
      - name: 更新說明
        run: |
          prev=$(git tag --list 'v*-beta.*' --sort=-creatordate | head -n1)
          {
            echo "測試版 $VERSION_NAME（$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')）"
            echo
            echo "## 這版更新"
            if [ -n "$prev" ]; then
              git log --no-merges --format='- %s' "$prev..HEAD"
            else
              git log --no-merges --format='- %s' -n 20
            fi
            echo
            echo "## 安裝"
            echo "手機下載下面的 \`cycle-$VERSION_NAME.apk\` 直接安裝，會蓋過舊版、存檔保留。第一次安裝要允許「安裝不明來源的應用程式」。"
            echo "這是開發中的測試版，還沒上架。"
          } > notes.md
          cat notes.md
      - name: 發布這一版
        run: |
          cp "cycle-$VERSION_NAME.apk" cycle-beta.apk
          gh release create "v$VERSION_NAME" "cycle-$VERSION_NAME.apk" \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "測試版 $VERSION_NAME" --notes-file notes.md
      - name: 更新固定的 beta 下載連結
        run: |
          gh release delete beta --cleanup-tag --yes || true
          gh release create beta cycle-beta.apk \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "最新測試版（$VERSION_NAME）" --notes-file notes.md
      - name: 只留最近 10 個測試版
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9.]+-beta\.[0-9]+$' | sort -t. -k4 -n -r | tail -n +11 \
            | while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
