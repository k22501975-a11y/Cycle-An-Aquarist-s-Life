spring:
  datasource:
    url: jdbc:h2:mem:cycle;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
cycle:
  allowed-origins: http://localhost:5173
  session-days: 30
  max-save-bytes: 2000
  market-min-account-days: 3
  payments-sandbox: true
  # 測試從同一個 IP 註冊很多帳號；頻率限制在 RateLimitTest 另外測
  rate-limit:
    register-per-hour: 100000
    login-per-ten-minutes: 100000
    events-per-minute: 100000
    push-per-minute: 100000
